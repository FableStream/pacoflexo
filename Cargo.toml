[package]
name = "pacoflexo"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A verifying caching proxy for Arch Linux package repositories"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FableStream/pacoflexo"
readme = "README.md"
keywords = ["arch", "pacman", "cache", "proxy", "mirror"]
categories = ["command-line-utilities", "web-programming::http-server", "caching"]
exclude = ["/.github"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
httpdate = "1.0.3"
libc = "0.2.191"
pgp = "0.21.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
